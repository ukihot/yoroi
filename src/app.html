<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<!-- Retro (Windows 95/98-style) UI accent font — see src/app.css's top comment. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Applies the saved Win95 color scheme (see /settings) before first
		     paint, so switching themes doesn't flash the old one on reload. -->
		<script>
			try {
				var t = localStorage.getItem('yoroi-theme');
				if (t) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
